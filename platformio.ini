[platformio]
default_envs = nucleo_f439zi
[env:nucleo_f439zi]
platform = ststm32
board = nucleo_f439zi
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
  -DSTM32F439xx
  -DUSE_HAL_DRIVER
  -DDEBUG
build_src_filter =
  +<*> -<socketcan_bus.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<socketcan_bus.cpp>
build_flags =
  -Isrc
